[project]
name = "control-protocols"
version = "0.1.0"
description = "AI control experiments on APPS programming problems, run with Inspect."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai",
    "openai>3.12",
    "anthropic",
    "huggingface_hub",
    "python-dotenv",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["control_protocols"]

[tool.pytest.ini_options]
testpaths = ["tests"]
